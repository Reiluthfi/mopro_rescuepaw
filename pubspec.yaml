name: mopro_rescuepaw
description: "RescuePaw: a mobile application for animal rescue and adoption."
publish_to: 'none' # Private app, prevents accidental publishing to pub.dev

# version: <major.minor.patch>+<build number>
# Bump only in the dev -> main release PR. The build number (after +)
# is Android's versionCode and must increase with every uploaded build.
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: 3.47.5 # Exact version, used by CI (flutter-version-file) and FVM

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
